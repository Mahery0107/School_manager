# Nginx : interface React (fichiers statiques) + API Laravel (PHP-FPM) sur le même domaine.
# À copier dans /etc/nginx/sites-available/gestion-ecole puis activer (voir DEPLOIEMENT.md).
# Remplacer ecole.exemple.mg par votre domaine. HTTPS est ajouté ensuite par certbot.

server {
    listen 80;
    listen [::]:80;
    server_name ecole.exemple.mg;

    root /var/www/gestion-ecole/frontend/dist;
    index index.html;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Laravel : toutes les requêtes /api/... passent par backend/public/index.php
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gestion-ecole/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/gestion-ecole/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;   # sauvegarde manuelle, génération de PDF
    }

    # Fichiers de l'interface : noms versionnés par Vite, mis en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html jamais en cache : chaque mise à jour est vue tout de suite
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Application React (React Router) : toute autre adresse renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers cachés (.env, .git…) jamais servis
    location ~ /\. {
        deny all;
    }
}
